[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "agentbom"
version = "0.1.0"
description = "AI agent security and attack-surface intelligence."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "MellyFinnese"}]
dependencies = ["jsonschema>=4.23,<5"]

[project.optional-dependencies]
dev = [
  "hypothesis>=6.112,<7",
  "pytest>=8,<9",
]

[project.scripts]
agentbom = "agentbom.cli_safe:main"

[tool.maturin]
manifest-path = "rust/agentbom-python/Cargo.toml"
bindings = "pyo3"
module-name = "agentbom.agentbom_native"
python-source = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
