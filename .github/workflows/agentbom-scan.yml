name: AgentBOM security scan

on:
  push:
  pull_request:

jobs:
  agentbom:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.85.1
      - name: Install AgentBOM
        run: python -m pip install .
      - name: Validate AgentBOM schema fixture
        run: agentbom validate examples/spec/go-producer/agentbom.json
      - name: Run Python tests
        run: python -m pytest -q
      - name: Emit SARIF
        run: agentbom sarif . --output agentbom.sarif
      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: agentbom.sarif
