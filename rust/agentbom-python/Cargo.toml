[package]
name = "agentbom-python"
version = "0.1.0"
edition = "2024"
license = "MIT"

[lib]
name = "agentbom_native"
crate-type = ["cdylib"]

[dependencies]
agentbom-core = { path = "../agentbom-core" }
agentbom-engine = { path = "../agentbom-engine" }
pyo3 = { version = "0.27", features = ["extension-module"] }
serde_json = "1"
