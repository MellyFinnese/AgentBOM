[package]
name = "agentbom-ffi"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Stable C ABI for the AgentBOM native security engine"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
agentbom-core = { path = "../agentbom-core" }
agentbom-engine = { path = "../agentbom-engine" }
serde_json = "1"
